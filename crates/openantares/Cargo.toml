[package]
name = "openantares"
version = "0.5.1"
edition = "2021"
description = "OpenAntares CLI: validate and inspect .ant interchange files"
readme = "README.md"
homepage = "https://github.com/openantares/openantares"
repository = "https://github.com/openantares/openantares"
license = "Apache-2.0"

# docs.rs builds with every feature on, so the feature-gated derives
# render in the reference; `docsrs` lets `#[cfg_attr(docsrs, ...)]`
# annotations mark them, should any be added.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
antares-format = { path = "../antares-format", version = "0.5.1" }
