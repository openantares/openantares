[package]
name = "antares-format"
version = "0.3.0"
edition = "2021"
description = "Open Antares format (.ant): zstd-framed NDJSON container for graph + evidence + belief + contradiction-case exchange"
readme = "README.md"
homepage = "https://github.com/openantares/openantares"
repository = "https://github.com/openantares/openantares"
license = "Apache-2.0"

# docs.rs builds with every feature on, so the feature-gated derives
# render in the reference; `docsrs` lets `#[cfg_attr(docsrs, ...)]`
# annotations mark them, should any be added.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Registry dependents build with --cap-lints=allow, so deny only
# gates this crate's own (and workspace) builds.
[lints.rust]
missing_docs = "deny"

[dependencies]
# Depends on the publishable subset ONLY — no engine crate — so
# antares-format + ant-types can be extracted together.
ant-types = { path = "../ant-types", version = "0.3.0" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
zstd = "0.13"
sha2 = "0.10"

[dev-dependencies]
# For the conformance golden generator only (example).
uuid.workspace = true
