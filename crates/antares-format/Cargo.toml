[package]
name = "antares-format"
version = "0.1.0"
edition = "2021"
description = "Open Antares format (.ant): zstd-framed NDJSON container for graph + evidence + belief exchange"
homepage = "https://github.com/openantares/openantares"
repository = "https://github.com/openantares/openantares"
license = "Apache-2.0"

[dependencies]
# Depends on the publishable subset ONLY — no engine crate — so
# antares-format + ant-types can be extracted together.
ant-types = { path = "../ant-types", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
zstd = "0.13"
sha2 = "0.10"

[dev-dependencies]
# For the conformance golden generator only (example).
uuid.workspace = true
