[package]
name = "antares-format"
version = "0.6.0"
edition = "2021"
description = "Open Antares format (.ant): streaming graph, evidence, belief, contradiction, proposal, and ontology exchange"
readme = "README.md"
homepage = "https://github.com/openantares/openantares"
repository = "https://github.com/openantares/openantares"
documentation = "https://docs.rs/antares-format"
license = "Apache-2.0"

# docs.rs builds with every feature on, so the feature-gated derives
# render in the reference; `docsrs` lets `#[cfg_attr(docsrs, ...)]`
# annotations mark them, should any be added.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Registry dependents build with --cap-lints=allow, so deny only
# gates this crate's own (and workspace) builds.
[lints.rust]
missing_docs = "deny"

[dependencies]
# Depends on the publishable subset ONLY — no engine crate — so
# antares-format + ant-types can be extracted together.
ant-types = { path = "../ant-types", version = "0.6.0" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
zstd = "0.13"
sha2 = "0.10"
# v1.0 `original_chunk` records carry their bytes as standard base64.
base64 = "0.22"

[features]
default = []
# Enables the schema generator (`examples/gen_schema.rs`), which derives
# `openantares/schema/ant.schema.json` and the mechanical parts of both
# reference bindings from the Rust types. CI regenerates and diffs.
schemars = ["dep:schemars", "ant-types/schemars"]

[dependencies.schemars]
version = "1"
optional = true
features = ["chrono04"]

[[example]]
name = "gen_schema"
required-features = ["schemars"]

[dev-dependencies]
# For the conformance golden generator only (example).
uuid.workspace = true
