[package]
name = "ant-types"
version = "0.4.0"
edition = "2021"
description = "Record types of the open Antares format (.ant): ids, graph, observation, evidence, belief, contradiction case, schema"
readme = "README.md"
homepage = "https://github.com/openantares/openantares"
repository = "https://github.com/openantares/openantares"
# Apache-2.0 like antares-format, NOT the workspace's MIT: this crate
# and antares-format are the subset published to openantares/ant, and
# the public subset has to be coherently licensed on its own.
license = "Apache-2.0"

# docs.rs builds with every feature on, so the feature-gated derives
# render in the reference; `docsrs` lets `#[cfg_attr(docsrs, ...)]`
# annotations mark them, should any be added.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Registry dependents build with --cap-lints=allow, so deny only
# gates this crate's own (and workspace) builds.
[lints.rust]
missing_docs = "deny"

[features]
default = []
# The engine turns this on so its OpenAPI derives keep working. It is
# off for anyone consuming the format: a format crate has no business
# depending on a web-framework doc generator.
utoipa = ["dep:utoipa"]
# JSON Schema derives, so the published `ant.schema.json` is GENERATED from
# these types rather than kept by hand beside them. Off by default for
# the same reason as `utoipa`: a consumer of the format does not need a
# schema generator in its tree.
schemars = ["dep:schemars"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
base64.workspace = true
thiserror.workspace = true
utoipa = { workspace = true, optional = true }
schemars = { version = "1", optional = true, features = ["chrono04", "uuid1"] }
